env=default

# === ????????? ????????? ===
api.base.url=http://localhost:8080
api.base.path=/api/v1

ui.base.url=https://default-url.com

# === browser config ===
# what mode can be: local, selenoid, testcontainers, selenoid-in-testcontainers
browser.mode=local
browser.name=chrome
browser.version=latest
browser.timeout=15000
browser.size=1920x1080
browser.headless=false

# for mode selenoid-in-testcontainers
browser.selenoid.in.testcontainers=true
browser.selenoid.chrome.version=122.0
browser.selenoid.firefox.version=123.0
browser.selenoid.edge.version=122.0

# Selenoid (mode=selenoid)
browser.selenoid.url=http://localhost:4444/wd/hub
browser.selenoid.vnc=true
browser.selenoid.video=false
browser.selenoid.log=true